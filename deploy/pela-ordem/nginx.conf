map $http_cf_connecting_ip $pela_ordem_client {
    "" $binary_remote_addr;
    default $http_cf_connecting_ip;
}
limit_req_zone $pela_ordem_client zone=pela_ordem_api:10m rate=30r/m;

server {
    listen 127.0.0.1:8113;
    server_name pelaordem.advogadosmca.com.br;
    client_max_body_size 8m;
    client_body_timeout 15s;
    access_log off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location /api/ {
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        limit_req zone=pela_ordem_api burst=6 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3313;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Middleware-Subrequest "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
    location / {
        proxy_pass http://127.0.0.1:3313;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Middleware-Subrequest "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
