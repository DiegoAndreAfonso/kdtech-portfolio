# Proposta de vhost para a central de projetos. Incluir no contexto http.
map $http_upgrade $hub_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 127.0.0.1:8110;
    server_name advogadosmca.com.br;

    root /srv/projects-hub/current;
    client_max_body_size 50m;

    # Somente a página inicial é substituída pelo hub.
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    location ^~ /hub-static/ {
        try_files $uri =404;
    }

    # Demais caminhos permanecem na aplicação jurídica, com o Host original.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $hub_connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
